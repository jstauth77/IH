<script>
(() => {
  // Géométrie du cercle (calculée à partir du tracé du logo)
  const CX = 1133.1, CY = 1871.2, R = 1124.5;
  const START = -90;                // départ en haut, sens horaire

  // Chronologie (ms)
  const T = {
    black: 800,                     // noir initial
    appear: 3200,                   // apparition du logo
    tour: 3000,                     // tour de lumière
    out: 1000,                      // extinction de la lumière
    hold: 3000,                     // pause, logo seul
    fade: 1200                      // disparition avant la boucle suivante
  };
  const t1 = T.black, t2 = t1 + T.appear, t3 = t2 + T.tour,
        t4 = t3 + T.out, t5 = t4 + T.hold, CYCLE = t5 + T.fade;

  const $ = id => document.getElementById(id);
  const logo = $('logo'), light = $('light'), trail = $('trail'),
        ember = $('ember'), flash = $('flash'), spark = $('spark');
  const NS = 'http://www.w3.org/2000/svg';

  [ember, flash].forEach(c => { c.setAttribute('cx', CX); c.setAttribute('cy', CY); c.setAttribute('r', R); });

  // Traînée : segments d'arc à opacité décroissante derrière la tête
  const SEG = 36, SPAN = 120, step = SPAN / SEG;
  const pt = a => [CX + R * Math.cos(a * Math.PI / 180), CY + R * Math.sin(a * Math.PI / 180)];
  for (let i = 0; i < SEG; i++) {
    const a0 = -(i + 1) * step - 0.6, a1 = -i * step;
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M${x0},${y0}A${R},${R} 0 0 1 ${x1},${y1}`);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#fff');
    p.setAttribute('stroke-width', 620);
    p.setAttribute('stroke-opacity', Math.pow(1 - i / SEG, 1.8).toFixed(3));
    trail.appendChild(p);
  }

  const clamp = v => Math.min(1, Math.max(0, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeSine = x => -(Math.cos(Math.PI * x) - 1) / 2;

  function setLogo(o, blur, scale) {
    logo.style.opacity = o.toFixed(3);
    logo.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
    logo.style.transform = `scale(${scale.toFixed(4)})`;
  }

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { setLogo(1, 0, 1); return; }

  let origin = null;
  function frame(now) {
    if (origin === null) origin = now;
    const fixed = location.hash.match(/t=(\d+)/);   // aperçu figé : page.html#t=5000
    const t = fixed ? +fixed[1] % CYCLE : (now - origin) % CYCLE;

    // --- Logo ---
    if (t < t1) {
      setLogo(0, 12, 0.96);
    } else if (t < t2) {
      const p = prog(t, t1, t2), e = easeOut(p);
      setLogo(easeSine(p), 12 * (1 - e), 0.96 + 0.04 * e);
    } else if (t < t5) {
      setLogo(1, 0, 1);
    } else {
      const p = easeSine(prog(t, t5, CYCLE));
      setLogo(1 - p, 5 * p, 1 + 0.008 * p);
    }

    // --- Lumière ---
    if (t >= t2 && t < t4) {
      const p = prog(t, t2, t3);
      const head = START + 360 * easeInOut(p);
      trail.setAttribute('transform', `rotate(${head} ${CX} ${CY})`);

      // braise sur la portion déjà parcourue
      const done = easeInOut(p);
      ember.setAttribute('stroke-dasharray', `${done} 1`);
      ember.setAttribute('transform', `rotate(${START} ${CX} ${CY})`);

      // éclat à la tête
      const [sx, sy] = pt(head);
      spark.setAttribute('cx', sx); spark.setAttribute('cy', sy);

      let master, trailOp, emberOp, flashOp, sparkOp;
      if (t < t3) {
        const fadeIn = easeSine(clamp(p / 0.08));
        master = fadeIn;
        trailOp = 1;
        emberOp = 0.32;
        flashOp = 0.55 * easeSine(prog(p, 0.9, 1));
        sparkOp = 0.9 * fadeIn * (1 - 0.6 * easeSine(prog(p, 0.92, 1)));
      } else {
        const q = prog(t, t3, t4);
        const rise = easeSine(clamp(q / 0.22));      // bref embrasement
        const fall = easeSine(prog(q, 0.22, 1));      // puis extinction
        master = 1 - fall;
        trailOp = 1 - easeSine(clamp(q / 0.35));
        emberOp = 0.32;
        flashOp = 0.55 + 0.35 * rise;
        sparkOp = 0.36 * (1 - easeSine(clamp(q / 0.3)));
      }
      light.setAttribute('opacity', master.toFixed(3));
      trail.setAttribute('opacity', trailOp.toFixed(3));
      ember.setAttribute('stroke-opacity', emberOp.toFixed(3));
      flash.setAttribute('stroke-opacity', flashOp.toFixed(3));
      spark.setAttribute('opacity', sparkOp.toFixed(3));
    } else {
      light.setAttribute('opacity', 0);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
